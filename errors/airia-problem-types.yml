description: Error catalogue derived from the response objects of all 1,299 operations in the Airia Web APIs OpenAPI.
  Airia returns the ASP.NET Core ProblemDetails shape (RFC 7807 members type/title/status/detail/instance plus free-form
  extensions) on 4xx/5xx and on the `default` response; validation failures add an `errors` map (ValidationProblemDetails/HttpValidationProblemDetails).
  The media type declared is application/json, not application/problem+json, so this is RFC 7807-shaped rather than
  RFC 9457-registered. Titles and remediation are written from the published API-keys, usage-limits and model-deprecation
  documentation; no error reference page is published, so per-code vendor text was not available to harvest.
format: rfc7807-shaped
media_type: application/json
envelope:
  schema: ProblemDetails
  members:
  - type
  - title
  - status
  - detail
  - instance
  extensions: additionalProperties (nullable) — vendor extensions permitted
  validation_variant: 'ValidationProblemDetails adds errors: { field: [messages] }'
  correlation: every operation accepts an x-correlation-id request header; responses carry x-correlation-id
domain_error_shapes:
- schema: EditorLockConflictResponse
  status: 423
  note: Concurrent-edit lock conflict on agent/pipeline editing.
- schema: GatewayApiKeyLimitReachedError
  note: code/limit/message shape returned when a gateway API-key limit is hit.
- schema: ThreatDetectionErrorResponse
  note: errorCode/message/httpStatus/diagnostics returned by guardrail and threat-detection paths.
- schema: PipelineExportError
  note: errorMessage/errorDetails[]/errorCode on agent (pipeline) export.
