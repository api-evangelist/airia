method: probed
source: live probe of /.well-known/ on every host this record knows
description: >-
  Probe of the /.well-known/ discovery surface on every Airia host: the marketing domain (airia.com,
  www.airia.com), the application/docs domain (airia.ai, www.airia.ai), the API host (api.airia.ai,
  also the OpenAPI servers[] host), the docs alias explore.airia.com, the identity host named by
  api.airia.ai/.well-known/service-configuration (identity.airia.ai), and the MCP Gateway hosts named
  in the MCP setup documentation (mcp-gateway.airia.ai and the Australian regional host
  prodaus.mcp-gateway.airia.ai). Status is the HTTP code observed at fetch time; only documents that
  returned a real, correctly typed payload were saved verbatim. api.airia.ai answers 401 with
  WWW-Authenticate: Bearer for every unrecognised /.well-known/ path, so the 401s below are a closed
  door rather than an absence — two documents on that host (jwks.json and the vendor-specific
  service-configuration) are served anonymously and are saved. airia.com/www.airia.com return a real
  404 body on every path. The MCP Gateway hosts publish RFC 9728 protected-resource metadata and RFC
  8414 authorization-server metadata anonymously, including a dynamic client registration endpoint.
