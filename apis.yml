apis:
- name: Airia Web APIs
  description: >-
    The platform REST API behind the Airia console: agents (pipelines) and pipeline execution,
    projects, data sources and knowledge retrieval, deployments, MCP deployments/gateways,
    governance use cases and workflows, risk registry, security posture management (Spm),
    shadow-AI discovery, red-teaming campaigns, gateway configuration, users/groups/roles,
    conversations, outbound webhook subscriptions, and a marketplace/library surface. OpenAPI 3.0
    generated by NSwag and served by the provider at api.airia.ai/swagger/v1/swagger.yaml
    (rendered by Scalar at api.airia.ai/docs/). Authentication is an X-API-Key header (personal
    access token or service-account key created under Settings > Developer > API Keys) or the
    console session cookie.
  humanURL: https://api.airia.ai/docs/
  baseURL: https://api.airia.ai
