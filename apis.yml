- name: Airia MCP Gateway
  description: >-
    Remote, OAuth-protected MCP Gateway (Streamable HTTP) that aggregates the MCP servers,
    SpecLink-converted OpenAPI tools, Agent Skills repositories and Airia-deployed agents an
    administrator has approved into one governed endpoint per gateway:
    https://mcp-gateway.airia.ai/gateway/{gateway-id}/mcp (Radar tool-search variant at
    /gateway/{gateway-id}/radar; regional hosts such as prodaus.mcp-gateway.airia.ai). Serves RFC
    9728 protected-resource metadata and RFC 8414 authorization-server metadata with dynamic client
    registration; tokens are issued by the Airia Keycloak realm at identity.airia.ai.
  humanURL: https://airia.ai/docs/mcp-servers/end-user-usage/how-to-set-up-a-gateway
  baseURL: https://mcp-gateway.airia.ai
