aid: airia
name: Airia
description: >-
  Airia (Airia LLC, Atlanta) is an enterprise AI orchestration, security and governance platform:
  a no-code/low-code/pro-code agent builder, a model routing and cost gateway, an MCP Gateway that
  fronts 1,000+ app connectors and turns hosted OpenAPI specs and Agent Skills repositories into
  governed MCP tools, plus AI discovery (shadow-AI inventory), red teaming, guardrails, risk
  registry and use-case governance. The platform is driven by the Airia Web APIs at api.airia.ai
  (OpenAPI 3.0, 1,299 operations, X-API-Key auth), a Python SDK on PyPI, and a remote OAuth-protected
  MCP Gateway at mcp-gateway.airia.ai.
image: https://airia.com/images/wp-content/uploads/2026/02/home-header-bg.jpg
url: https://raw.githubusercontent.com/api-evangelist/airia/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
x-tier: profiled
x-tier-reason: enrichment pass 2026-09-19 found a published OpenAPI, a PyPI SDK and a remote MCP gateway
specificationVersion: '0.20'
created: '2026-09-19'
modified: '2026-09-19'
tags:
- Company
