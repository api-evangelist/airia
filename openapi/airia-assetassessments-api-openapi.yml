          - 'null'
          format: guid
        originSource:
          type:
          - string
          - 'null'
        originContext:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
    AssessmentStatus:
      type: string
      description: ''
      x-enumNames:
      - Draft
      - Pending
      - Approved
      - Rejected
      - AutoComplete
      - ReadyForReview
      - AutoCompleteFailed
      enum:
      - Draft
      - Pending
      - Approved
      - Rejected
      - AutoComplete
      - ReadyForReview
      - AutoCompleteFailed
    AutoCompleteAssessmentRequest:
      type: object
      additionalProperties: false
      properties:
        includeExecutionLogs:
          type: boolean
        logSampleSize:
          type: integer
          format: int32
          maximum: 1000
          minimum: 1
        confidenceThreshold:
          type: number
          format: double
          maximum: 1
          minimum: 0
    CreateAssessmentRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        templateId:
          type: string
          format: guid
        templateVersionId:
          type: string
          format: guid
        version:
          type: string
        approverId:
          type: string
          format: guid
        fileId:
          type:
          - string
          - 'null'
        originId:
          type:
          - string
          - 'null'
          format: guid
        originSource:
          type:
          - string
          - 'null'
        originContext:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
    AssessmentTemplateCategory:
      type: string
      description: ''
      x-enumNames:
      - Exploratory
      - Attestation
      enum:
      - Exploratory
      - Attestation
    PagedResultOfAssessmentListDto:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentListDto'
