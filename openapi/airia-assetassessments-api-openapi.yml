          type: integer
          format: int32
        newerVersionAvailable:
          type: boolean
        version:
          type: string
        status:
          $ref: '#/components/schemas/AssessmentStatus'
        lastCompletedAt:
          type:
          - string
          - 'null'
          format: date-time
        needsReReview:
          type: boolean
        approverId:
          type: string
          format: guid
        userId:
