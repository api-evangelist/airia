      - $ref: '#/components/schemas/AssessmentListDto'
      - type: object
        additionalProperties: false
        properties:
          parsedResponses:
            type: array
            items:
              $ref: '#/components/schemas/AssessmentResponseItemDto'
          aiAssetAggregateId:
            type: string
            format: guid
    AssessmentListDto:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: guid
        name:
          type: string
        templateName:
          type:
          - string
          - 'null'
        category:
          oneOf:
          - $ref: '#/components/schemas/AssessmentTemplateCategory'
        subCategories:
          type: array
          items:
