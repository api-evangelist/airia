        latestPublishedVersionNumber:
          type:
          - integer
          - 'null'
          format: int32
        latestPublishedVersionId:
          type:
          - string
          - 'null'
          format: guid
        hasDraft:
          type: boolean
        questionCount:
          type: integer
          format: int32
        isActive:
          type: boolean
        hasAssessments:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          type:
          - string
          - 'null'
          format: guid
    AssessmentResponseItemDto:
      type: object
      additionalProperties: false
      properties:
        sectionName:
          type: string
        question:
          type: string
