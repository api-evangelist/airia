              schema:
                $ref: '#/components/schemas/ProblemDetails'
        403:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Discovery dashboard get asset decision history
      x-summary-source: derived
components:
  schemas:
    DiscoveryFindingSeverity:
      type: string
      description: ''
      x-enumNames:
      - Info
      - Medium
      - High
      - Critical
      enum:
      - Info
      - Medium
      - High
      - Critical
    DiscoveryFindingImpactDto:
      type: object
      additionalProperties: false
      properties:
        affectedAssets:
          type: integer
          format: int32
        affectedUsers:
          type: integer
          format: int32
        sharePct:
          type: integer
          format: int32
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryCategoryCountDto'
        topApps:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryTopAppDto'
    AiAssetReviewDecisionAction:
      type: string
