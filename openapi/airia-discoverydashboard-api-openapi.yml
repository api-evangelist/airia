openapi: 3.2.0
info:
  title: Airia Web Discovery Dashboard API
  version: 1.0.0
servers:
- url: https://api.airia.ai
tags:
- name: DiscoveryDashboard
paths:
  /v1/discovery/dashboard/summary:
    get:
      tags:
      - DiscoveryDashboard
      operationId: DiscoveryDashboard_GetSummary
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          format: int32
          default: 30
        x-position: 1
      - name: x-correlation-id
        in: header
        schema:
          type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDashboardSummaryDto'
        401:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        403:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Discovery dashboard get summary
      x-summary-source: derived
  /v1/discovery/dashboard/ai-calls:
    get:
      tags:
      - DiscoveryDashboard
      operationId: DiscoveryDashboard_GetAiCalls
      parameters:
      - name: x-correlation-id
        in: header
        schema:
          type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryAiCallsDto'
        204:
          description: ''
        401:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        403:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Discovery dashboard get ai calls
      x-summary-source: derived
  /v1/discovery/dashboard/findings:
    get:
      tags:
      - DiscoveryDashboard
      operationId: DiscoveryDashboard_GetFindings
      parameters:
      - name: x-correlation-id
        in: header
        schema:
          type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscoveryFindingDto'
        401:
          description: ''
          content:
            application/json:
              schema:
