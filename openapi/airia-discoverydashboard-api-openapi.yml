      x-summary-source: derived
  /v1/discovery/dashboard/assets:
    get:
      tags:
      - DiscoveryDashboard
      operationId: DiscoveryDashboard_GetAssets
      parameters:
      - name: findingType
        in: query
        schema:
          oneOf:
          - $ref: '#/components/schemas/DiscoveryFindingType'
        x-position: 1
      - name: category
        in: query
        schema:
          oneOf:
          - $ref: '#/components/schemas/DiscoveryAssetCategory'
        x-position: 2
      - name: IncludeTotalCount
        in: query
        schema:
          type: boolean
        x-position: 3
      - name: PageNumber
        in: query
        schema:
          type: integer
          format: int32
        x-position: 4
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
        x-position: 5
      - name: SortBy
        in: query
        schema:
          type:
          - string
          - 'null'
        x-position: 6
      - name: SortDirection
        in: query
        schema:
          type: string
        x-position: 7
      - name: reviewDecision
        in: query
        schema:
          type:
          - string
          - 'null'
        x-position: 8
      - name: x-correlation-id
        in: header
        schema:
          type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultV2OfDiscoveryAssetDto'
        400:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        401:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        403:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Discovery dashboard get assets
      x-summary-source: derived
  /v1/discovery/dashboard/findings/{findingType}/graph:
    get:
      tags:
      - DiscoveryDashboard
      operationId: DiscoveryDashboard_GetFindingGraph
      parameters:
      - name: findingType
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DiscoveryFindingType'
        x-position: 1
      - name: maxPeople
        in: query
        schema:
          type: integer
          format: int32
          default: 24
        x-position: 2
      - name: x-correlation-id
        in: header
        schema:
          type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryFindingGraphDto'
        401:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        403:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Discovery dashboard get finding graph
      x-summary-source: derived
  /v1/discovery/dashboard/assets/{id}:
    get:
      tags:
      - DiscoveryDashboard
      operationId: DiscoveryDashboard_GetAssetDetail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: guid
        x-position: 1
      - name: x-correlation-id
        in: header
        schema:
          type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryAssetDetailDto'
        404:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        401:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        403:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Discovery dashboard get asset detail
      x-summary-source: derived
  /v1/discovery/dashboard/assets/{id}/decision-history:
    get:
      tags:
      - DiscoveryDashboard
      operationId: DiscoveryDashboard_GetAssetDecisionHistory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: guid
        x-position: 1
      - name: x-correlation-id
        in: header
        schema:
          type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiAssetReviewDecisionHistoryEntry'
        401:
          description: ''
          content:
