      - DiscoveredApps
      - SpmInventory
    DiscoveryFindingType:
      type: string
      description: ''
      x-enumNames:
      - ScopeExposure
      - UndeclaredApps
      - OverExposedPeople
      - RecentApps
      - WeakPosture
