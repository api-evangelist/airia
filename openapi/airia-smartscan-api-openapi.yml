          fileSize:
            type:
            - integer
            - 'null'
            format: int64
          fileDate:
            type:
            - string
            - 'null'
            format: date-time
          result:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/UpdateSmartScanFileRequest'
          status:
            $ref: '#/components/schemas/SmartScanFileStatus'
          smartScanId:
            type: string
            format: guid
    SmartScan:
      allOf:
      - $ref: '#/components/schemas/BaseEntity'
      - type: object
        additionalProperties: false
        properties:
          name:
            type: string
          status:
            maxLength: 15
            minLength: 0
            oneOf:
