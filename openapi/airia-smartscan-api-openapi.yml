          - 'null'
          format: guid
        smartScanPrompts:
          type: array
          items:
            $ref: '#/components/schemas/CreateSmartScanPromptRequest'
        fileIds:
          type:
          - array
          - 'null'
          items:
            type:
            - string
            - 'null'
            format: guid
        name:
          type:
          - string
          - 'null'
        pipelineId:
          type:
          - string
          - 'null'
          format: guid
    BaseAuditEntity:
