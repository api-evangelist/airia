          type: string
          format: guid
        name:
          type: string
          maxLength: 256
        message:
          type: string
          maxLength: 4096
        description:
          type: string
          maxLength: 4096
        updatedAt:
          type: string
          format: date-time
        activeDeployments:
          type: integer
          format: int32
        projectId:
          type: string
          format: guid
        projectName:
          type:
          - string
          - 'null'
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectModelBase'
    ProjectModelBase:
