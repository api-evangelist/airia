          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    CreateUserPrompt:
      type: object
      additionalProperties: false
      required:
      - name
      - message
      properties:
        name:
          type: string
          maxLength: 256
          minLength: 1
        message:
          type: string
          maxLength: 4096
          minLength: 1
        description:
          type: string
          maxLength: 4096
        projectId:
          type: string
          format: guid
    UserPromptDto:
