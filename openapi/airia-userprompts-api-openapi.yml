components:
  schemas:
    PipelineUsageInfo:
      type: object
      additionalProperties: false
      properties:
        pipelineId:
          type: string
          format: guid
        pipelineName:
          type: string
        pipelineVersionId:
          type: string
          format: guid
        versionNumber:
          type: string
        isLatest:
          type: boolean
        projectId:
          type:
          - string
          - 'null'
          format: guid
    PipelineUsageInfoResult:
      type: object
      additionalProperties: false
      properties:
        references:
          type: array
          items:
            $ref: '#/components/schemas/PipelineUsageInfo'
        usedInOtherProjects:
