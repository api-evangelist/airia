      tags:
      - WorkflowBranchActivations
      operationId: WorkflowBranchActivations_ForceCancel2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: guid
        x-position: 1
      - name: x-correlation-id
        in: header
