  observed: '2026-09-19'
deprecation_policy:
  scope: AI models, not the API
  url: https://airia.ai/docs/build/components/model-deprecation
  summary: >-
    Deprecation dates come from the model provider; Airia checks daily and surfaces a banner starting
    90 days before retirement to administrators and anyone with model-management permission, but only
    when the model is in use by at least one agent.
  ladder:
  - window: '>90 days'
    warning: none
  - window: 90 / 60 / 30 days
    warning: dismissible for the session
  - window: <=15 days
    warning: non-dismissible critical banner
  - window: past retirement
    warning: 'non-dismissible "already deprecated" banner; the model may stop responding'
  enforcement: >-
    A model past its deprecation date cannot be added to an agent at all; one within 90 days warns
    and offers a replacement.
api_versioning:
  scheme: path segment
  versions:
  - v1
  - v2
  spec_version: 1.0.0
  policy_published: false
  sunset_header: not documented
  note: >-
    v2 exists only for a handful of families (PipelineExecution, docgen); the contract is
    overwhelmingly /v1/. No written policy states how long a version is supported.
