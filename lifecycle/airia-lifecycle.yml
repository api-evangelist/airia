description: >-
  Airia's published lifecycle commitments. The platform has an Atlassian-hosted status page covering
  seven regional environments, and a documented model-deprecation policy with a dated, escalating
  warning ladder. It does NOT publish an API versioning or API deprecation policy: the release-notes
  page requires a login, the OpenAPI carries a flat info.version of 1.0.0 with v1/v2 path segments
  and no Sunset/Deprecation header contract, and seven operations are flagged deprecated in the spec
  with no stated removal date.
