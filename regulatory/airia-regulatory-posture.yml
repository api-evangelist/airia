not_found:
- signal: sbom
  note: No SBOM published; never derived.
- signal: accessibility_conformance
  note: No VPAT or accessibility conformance report found on any probed path.
- signal: subprocessors
  note: >-
    No subprocessor table is public. The privacy policy names categories of third-party service
    providers but never lists them, and the Vanta trust center that would normally carry the list
    renders client-side only.
- signal: support_lifetime
  note: >-
    No support period is stated for the API. Model retirement dates come from the model providers,
    not from Airia (see lifecycle/airia-lifecycle.yml).
- signal: training_data_summary
  note: No statement about training data for any Airia-operated model was found.
- signal: ai_transparency
  note: >-
    No AI transparency report. The platform GENERATES governance evidence for customers; Airia
    publishes none about itself.
- signal: global_privacy_control
  note: No published GPC statement. Not tested by sending a Sec-GPC header — one request is not a commitment.
- signal: incident_notification
  note: >-
    Operational incidents are published on https://status.airia.com/ with an Atom feed, but no
    security-incident notification commitment is published.
- signal: age_assurance
  note: Not applicable to an enterprise platform; nothing published.
- signal: notice_and_action
  note: No content-reporting path; not a hosting platform.
- signal: transparency_report
  note: None published.
- signal: exit_assistance
  note: >-
    No documented export/exit path for a departing tenant. The API has agent export
    (PipelineExport) and conversation export operations, but no published exit-assistance commitment.
