generated: '2026-09-19'
method: probed
source: live probes of airia.com legal/conventional paths + artifacts harvested this run
description: >-
  Harvest of the horizontal regulatory signals a company can publish (AI transparency, accessibility,
  privacy operations, product security, support lifetime). Airia sells AI governance, so the
  contrast is worth stating plainly: the product models the EU AI Act, NIST AI RMF and ISO/IEC 42001
  as first-class data (see conformance/airia-conformance.yml), while Airia's own horizontal
  disclosures are thin — one privacy policy with a named controller and a privacy contact, one
  documented data-residency commitment, and nothing else reachable without a login. Conventional
  paths were probed and returned 404; the docs pages that would carry data-management detail are
  behind the platform login. An empty signal is a measurement, not a failure to look.
signals:
  data_residency:
    published: true
    pointer_type: DataResidency
    url: https://airia.ai/docs/developers-hub/capabilities/data-residency
    http_status: 200
    substance: >-
      Names six selectable storage regions (North America US East, Canada, Netherlands, UAE North,
      Singapore, Australia East), states the default region (North America US East), and enumerates
      which data categories stay in region (agent configurations, conversation histories, uploaded
      files, vector embeddings, logs) versus which may leave it (user profiles, billing,
      authentication tokens, usage metrics, support tickets). Explicitly states processing and model
      inference may occur outside the selected region.
    tier: Enterprise
    checked: '2026-09-19'
  data_subject_request:
    published: partial
    pointer_type: DataSubjectRequest
    url: https://airia.com/privacy-policy/
    http_status: 200
    substance: >-
      The privacy policy names the controller (Airia LLC, PO Box 190778, Miami Beach, FL 33119), a
      privacy contact (privacy@airia.com), and states rights to access, update, delete and object.
      There is no request portal, no dedicated /privacy/requests page (404) and no stated response
      window, so this is a contact rather than a process.
    checked: '2026-09-19'
