method: derived
source: openapi/airia-openapi.yml + https://airia.ai/docs/build/knowledge/guides/mcp-retrieval
description: >-
  Crosswalk between the MCP surface Airia publishes and the REST operations of the Airia Web APIs.
  Airia's MCP Gateway is an aggregator: the tools a client sees are chosen per gateway by an
  administrator, and the live schemas sit behind OAuth (an anonymous tools/list against
  https://mcp-gateway.airia.ai/mcp returns 401). The only tool list Airia publishes without a
  credential is the Airia Datasource MCP Server table in the retrieval guide, so that is what is
  mapped here — by name and semantics, not by fetched inputSchema, and confidence is recorded
  accordingly. Nothing below asserts a binding the documentation does not support.
surfaces:
  openapi: openapi/airia-openapi.yml
  openapi_url: https://api.airia.ai/swagger/v1/swagger.yaml
  openapi_gated: false
  mcp_url: https://mcp-gateway.airia.ai/gateway/{gateway-id}/mcp
  mcp_gated: true
  mcp_gate: OAuth 2.1 (RFC 9728 protected resource; scopes mcp.read / mcp.write)
  graphql: none published
crosswalk:
