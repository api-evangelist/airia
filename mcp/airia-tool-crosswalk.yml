  binding: semantic
  confidence: medium
  note: >-
    GET /v1/DataVectorSearch/file/{fileId}/content returns parsed file content — the same job the MCP
    tool does. Matched by name and path, not by a fetched inputSchema.
- tool: Graph Database Cypher Query
  category: knowledge-graph
  rest:
  - Graphs_ExecuteCypherQuery
  binding: semantic
  confidence: medium
  note: >-
    The Graphs tag publishes an explicit Cypher execution operation, which is the REST twin of this
    tool; parameters were not compared against a live MCP schema.
- tool: Multi Data Store SQL Query
  category: retrieval
  rest:
  - SqlDocuments_PostExecuteSqlQuery
  binding: semantic
  confidence: medium
  note: >-
    The REST SQL-query operation exists but is marked deprecated in the spec, so the MCP tool is
    likely the supported path rather than a wrapper of it.
mcp_only:
- tool: Tools exposed by catalogue app servers (Jira, Confluence, Box, Snowflake, Microsoft Graph, Airtable, Brave Search, ...)
  reason: >-
    These are third-party MCP servers the gateway fronts. They are not Airia REST operations at all;
    Airia governs, scans and proxies them.
- tool: Tools published from an Airia agent via the Tool & MCP interface
  reason: >-
    Each deployed agent becomes its own tool with a customer-defined name, description and input
    schema. There is no fixed REST operation behind it — the agent is the tool.
- tool: Tools produced by SpecLink from a customer's OpenAPI
  reason: Generated per tenant from a customer-supplied spec; not part of Airia's own contract.
- tool: Agent Skills served over MCP resources
  reason: Skills are MCP resources served from a GitHub repo or remote skills server, not REST operations.
rest_only_note: >-
  The overwhelming majority of the 1,299 REST operations have no MCP tool: the Airia Web APIs are the
  platform control plane (governance, discovery, red teaming, users, budgets), while the MCP surface
  is the runtime tool layer for agents. The one REST family that is explicitly about the MCP surface
  is McpDeployments / McpLibraries / McpServers / GatewayConfiguration / SkillsRepositories — those
  operations configure gateways rather than being exposed as tools.
